# Every hour: is the app up? Calls /api/health (public, ok/not ok per check, no details). When it is red the run
# fails and GitHub e-mails the owner. The daily check with details is in the 9h robot (Central -> Painel).
name: Saúde do servidor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Conferir o servidor
        run: |
          set -e
          for i in 1 2 3; do
            code=$(curl -s -o out.json -w '%{http_code}' --max-time 25 https://praondefoi.app.br/api/health || echo 000)
            echo "tentativa $i: HTTP $code"; cat out.json || true; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::O servidor do Pra Onde Foi não respondeu bem em 3 tentativas"
          exit 1
