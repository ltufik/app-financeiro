# Weekly copy of the database outside Supabase (Sunday, 3h37 in Brazil), with a restore test every time.
# 1. pg_dump of the public and auth schemas (custom format) through the Supabase session pooler.
# 2. Restore test: a fresh Postgres gets the shim + supabase/schema.sql + the copy's data; every table must come back
#    with the same rows (scripts/copia-restaura.sh). Only table names and counts are printed.
# 3. The copy is encrypted (gpg, AES256, passphrase only Luiz keeps) and kept as a private artifact for 90 days.
#    Nothing goes into the repository. When anything fails, the run fails and GitHub e-mails the owner.
# Secrets (GitHub → Settings → Secrets and variables → Actions): SUPABASE_DB_URL (Supabase → Connect → Session pooler,
# with the database password) and BACKUP_PASSPHRASE. How to restore: Central → Documentação → "Cópia semanal".
name: Cópia semanal do banco
on:
  schedule:
    - cron: '37 6 * * 0'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: copia
  cancel-in-progress: false
jobs:
  copia:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir os segredos
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Falta o segredo SUPABASE_DB_URL (Supabase → Connect → Session pooler)"; exit 1; }
          [ ${#BACKUP_PASSPHRASE} -ge 16 ] || { echo "::error::Falta o segredo BACKUP_PASSPHRASE (16 caracteres ou mais)"; exit 1; }
      - name: Instalar o cliente do Postgres 17
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Fazer a cópia
        run: |
          set -e
          D=$(date -u +%Y-%m-%d); echo "D=$D" >> "$GITHUB_ENV"
          pg_dump "$SUPABASE_DB_URL" -Fc --schema=public --schema=auth --no-owner --no-privileges -f "$RUNNER_TEMP/copia.dump"
          echo "cópia: $(du -h "$RUNNER_TEMP/copia.dump" | cut -f1)"
      - name: Testar a restauração
        run: |
          sh scripts/copia-restaura.sh "$RUNNER_TEMP/copia.dump" "postgresql://postgres:teste@localhost:5432/postgres" | tee "$RUNNER_TEMP/restaura.txt"
          { echo "### Cópia de $D"; echo '```'; cat "$RUNNER_TEMP/restaura.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Criptografar
        run: |
          set -e
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase-fd 3 \
            -o "$RUNNER_TEMP/copia-$D.dump.gpg" "$RUNNER_TEMP/copia.dump" 3<<EOF
          $BACKUP_PASSPHRASE
          EOF
          rm -f "$RUNNER_TEMP/copia.dump"
      - uses: actions/upload-artifact@v4
        with:
          name: copia-${{ env.D }}
          path: ${{ runner.temp }}/copia-${{ env.D }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
